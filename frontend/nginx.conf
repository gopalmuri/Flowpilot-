# ========================================================================
# FlowPilot Frontend - Nginx Static File Serving & SPA Fallback
# =======================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Serve static assets directly, fallback to index.html for client-side SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets with content hash
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpegwgif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
