# ==============================================================================
# FlowPilot - Production Docker Compose Orchestration
# ==============================================================================

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowpilot-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-flowpilot_prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-flowpilot_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowpilot-backend-network

  redis:
    image: redis:7-alpine
    container_name: flowpilot-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowpilot-backend-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: flowpilot-prod-backend
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      FORCE_HTTPS: "True"
      RATE_LIMIT_ENABLED: "True"
      SECRET_KEY: ${SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flowpilot_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: "True"
      COOKIE_SAMESITE: lax
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - flowpilot-backend-network
      - flowpilot-dmz-network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: flowpilot-prod-celery
    restart: always
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flowpilot_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - flowpilot-backend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: flowpilot-prod-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - flowpilot-dmz-network

  nginx:
    image: nginx:1.27-alpine
    container_name: flowpilot-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - flowpilot-dmz-network

volumes:
  pgdata_prod:
  redisdata_prod:

networks:
  flowpilot-backend-network:
    internal: true
  flowpilot-dmz-network:
    driver: bridge
